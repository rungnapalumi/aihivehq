name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            aihive_coach/requirements.txt
            voice/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests (skip E2E)
        env:
          # Ensure demo mode: no OpenAI calls or secrets.
          OPENAI_API_KEY: ""
        run: |
          unset OPENAI_API_KEY
          PYTHONPATH=. python -m pytest -q -m "not e2e"

  # E2E (Playwright + Streamlit) is skipped in CI: it needs a browser install,
  # starts local Streamlit servers, and takes several minutes. Run locally with:
  #   playwright install chromium
  #   PYTHONPATH=. python -m pytest -q -m e2e
