[pytest]
testpaths =
    aihive_coach/tests
    tutor/tests
    marketing/tests
    voice/tests
    workforce/tests
    developer/tests
    benchmarks
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    e2e: Playwright/Streamlit browser end-to-end tests (slow)
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
