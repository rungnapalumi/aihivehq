[theme]
base = "dark"
primaryColor = "#2563eb"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#0f1629"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
